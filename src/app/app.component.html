<ion-app>

  <ion-menu contentId="main" menuId="first" side="start" type="overlay" [disabled]="true">
    <ion-header>
      <ion-toolbar color="tertiary" >
        <ion-icon slot="start" size="large" name="menu-outline" style="padding-left:10px"></ion-icon>
        <ion-title>¡Hola! {{this.usuario}}</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <ion-menu-toggle *ngFor="let i of opciones">
        <ion-item [routerLink]="i.redirecTo" detail="true">
          <ion-icon slot="start" [name]="i.icon" color="white"></ion-icon>
          <ion-label>{{i.name}}</ion-label>
        </ion-item>
      </ion-menu-toggle>

      <ion-item>
        <ion-icon slot="start" name="exit-outline" color="dark"></ion-icon>
        <ion-text (click)="CerrarSesion()" style="font-family: georgia;">Cerrar Sesión</ion-text>
      </ion-item>

    </ion-content>
  </ion-menu>


  <ion-router-outlet id="main"></ion-router-outlet>
</ion-app>
