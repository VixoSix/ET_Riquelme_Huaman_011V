<ion-tabs (ionTabsDidChange)="onTabChange($event)">
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="tab1" href="/tabs/tab1" (click)="tabSeleccionado = 'tab1'" >
      <ion-icon aria-hidden="true" [name]="tabSeleccionado === 'tab1' ? 'home' : 'home-outline'" color="dark"
      [ngClass]="{'selected': tabSeleccionado === 'tab1', 'deselected': tabSeleccionado !== 'tab1'}"></ion-icon>
      <p *ngIf="tabSeleccionado === 'tab1'" class="indicator">-</p>
    </ion-tab-button>

    <ion-tab-button tab="tab2" href="/tabs/tab2" (click)="tabSeleccionado = 'tab2'" >
      <ion-icon aria-hidden="true"  [name]="tabSeleccionado === 'tab2' ? 'qr-code' : 'qr-code-outline'" color="dark"
      [ngClass]="{'selected': tabSeleccionado === 'tab2', 'deselected': tabSeleccionado !== 'tab2'}"></ion-icon>
      <p *ngIf="tabSeleccionado === 'tab2'" class="indicator">-</p>
    </ion-tab-button>

    <ion-tab-button tab="tab3" href="/tabs/tab3" (click)="tabSeleccionado = 'tab3'" >
      <ion-icon aria-hidden="true"  [name]="tabSeleccionado === 'tab3' ? 'calendar' : 'calendar-outline'" color="dark"
      [ngClass]="{'selected': tabSeleccionado === 'tab3', 'deselected': tabSeleccionado !== 'tab3'}"></ion-icon>
      <p *ngIf="tabSeleccionado === 'tab3'" class="indicator">-</p>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
