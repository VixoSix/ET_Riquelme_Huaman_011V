<ion-content [fullscreen]="true">
  <div class="container-color">

      <div class="Header">
        <div class="wrapBackButton">
          <button class="backButton" (click)="volver()">
            <ion-icon name="arrow-back"></ion-icon>
          </button>
        </div>
        <div class="wrapTitle">
          <h1>Detalle Asistencia</h1> 
        </div>
      </div>

    <div class="container">

      <div class="titulo">
        <h1>FECHA: {{ asistencia?.fecha }} </h1>
      </div>

      <div class="wrapData">
        <p>Alumno</p>
        <h2>{{ asistencia?.nombre }}</h2>
      </div>

      <div class="wrapData">
        <p>Asignatura</p>
        <h2>{{ asignatura?.nombre }}</h2>
      </div>
      
      <div class="wrapData">
        <p>Docente</p>
        <h2>{{ profesor?.nombre }} {{ profesor?.apellido }}</h2>
      </div>

      <div class="buttons">
        <div class="button">
          <ion-button (click)="editarAsistencia(this.asistencia)" expand="block">Actualizar Asistencia</ion-button>
        </div>
        <div class="button">
          <ion-button (click)="consultaEliminar()" expand="block">Eliminar</ion-button>
        </div>
      </div>


    </div> 
  </div>
  
</ion-content>
