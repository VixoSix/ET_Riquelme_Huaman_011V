<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="end">
      <ion-button>
        <ion-back-button (click)="volver()" text="Volver" color="dark"></ion-back-button>
      </ion-button>
    </ion-buttons>
    <ion-title>Restablecer contraseña</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="container">

    <div class="logo">
      <h1>¿Olvidaste tu contraseña?</h1>
      <p>Ingresa tu correo electrónico para restablecer contraseña</p>
    </div>

    <div class="login">
      <h2>Correo Electrónico</h2>
    </div>

    <form [formGroup]="restablecerForm">
      <div class="input">
        <ion-item lines="none" class="ion-item">
          <ion-input type="email" placeholder="Correo electrónico" name="correo" formControlName="correo"></ion-input>  
        </ion-item>
        <span></span>

        <div class="wrapMsg" *ngIf="restablecerForm.get('correo')?.invalid &&
                                    (restablecerForm.get('correo')?.dirty || 
                                    restablecerForm.get('correo')?.touched)">
          <div class="msg" *ngIf="restablecerForm.get('correo')?.hasError('required')">
            <p>*El Correo electrónico es obligatorio.</p>
          </div>
          <div class="msg" *ngIf="restablecerForm.get('correo')?.hasError('minlength')">
            <p>*El correo debe tener mínimo 8 caracteres.</p>
          </div>
        </div>
      </div>

      <div class="boton">
        <ion-button expand="block" (click)="IrARestablecer()">Restablecer contraseña</ion-button>
      </div>
    </form>
  </div>
</ion-content>
