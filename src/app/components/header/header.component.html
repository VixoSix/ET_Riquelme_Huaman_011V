<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <!-- Usar goBack() para manejar el retroceso -->
      <ion-back-button (click)="goBack()" text="" color="dark"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ title }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="mostrarMenu()">
        <ion-icon name="menu-outline" color="dark"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
